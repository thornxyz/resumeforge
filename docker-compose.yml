services:
  postgres:
    image: postgres:17.5-alpine
    container_name: resume-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: resumes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  latex-api:
    build:
      context: ./latex-api
      dockerfile: Dockerfile
    container_name: resume-latex-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  texlab-lsp:
    build:
      context: ./texlab-lsp
      dockerfile: Dockerfile
    container_name: resume-texlab-lsp
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - uploads:/workspace

  code-agent:
    build:
      context: ./code-agent
      dockerfile: Dockerfile
    container_name: resume-code-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LATEX_API_URL=http://latex-api:8000
      - LATEX_TEMP_DIR=/tmp/latex_compile
    ports:
      - "8001:8001"
    depends_on:
      - latex-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/resumes
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=http://localhost:3000
      - LATEX_API_URL=http://latex-api:8000
      - FASTAPI_URL=http://code-agent:8001
      - TEXLAB_LSP_URL=ws://texlab-lsp:8002
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres
      - latex-api
      - code-agent

volumes:
  pgdata:
  uploads:
